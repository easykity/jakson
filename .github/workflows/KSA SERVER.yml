name: KSA SERVER Auto Update

on:
  schedule:
    - cron: '*/5 * * * *'   # প্রতি ৫ মিনিট পর পর চলবে
  workflow_dispatch:        # ম্যানুয়ালি রান করার জন্য

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run generator script
        env:
          KSA_SERVER1: ${{ secrets.KSA_SERVER1 }}
        run: python scripts/generate.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posters LiveEVENT.m3u
          if ! git diff --staged --quiet; then
            git commit -m "Auto update posters and LiveEVENT.m3u"
            git push
          else
            echo "No changes detected."
          fi
